<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#" method="post" align="Center">
        <label for="Full Name" required>Name:</label>
        <input type="text" id="Full Name" name="name" required><span style="color: red;">*</span>
        <br><br>
        <label for="Email" required>Email:</label>
        <input type="email" id="Email" name="email" required><span style="color: red;">*</span><br><br>
        <label for="Phone" required >Phone No:</label>
        <input type="tel" id="Phone" name="phone" required><span style="color: red;">*</span><br><br>
        <label for ="Check In">Check In:</label>
        <input type="date" id="Check In" name="Check In" required><br><br>
        <label for="Check Out">Check Out:</label>
        <input type="date" id="Check Out" name="Check Out" required><br><br>
        <label for="Room Type">Room Type:</label>
        <select id="Room Type" name="Room Type" required>
            <option value="Single">Single</option>
            <option value="Double">Double</option>
            <option value="Luxury">Luxury</option>
        </select><br><br>
        <label for="No. Of Guest">No. Of Guest:</label>
        <input type="number" id="No. Of Guest" name="No. Of Guest" required><br><br>
        <label for="Special Request">Special Request:</label>
        <textarea id="Special Request" name="Special Request" rows="4" cols="50">
        </textarea><br><br> 
        <input type="Submit" value="Submit">
    </form>
</body>
</html>

<!-- Here Input is tag and type is an attribute of the input tag -->
